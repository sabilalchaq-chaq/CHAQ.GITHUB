<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C84B31" />
      <stop offset="100%" stop-color="#E25822" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A826" />
      <stop offset="100%" stop-color="#F7B731" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#primaryGrad)" />
    <!-- Cloche / Wok Silhouette -->
    <path d="M16 36 C16 25 23 18 30 18 C37 18 44 25 44 36 Z" fill="#FFFFFF" />
    <path d="M12 37 C12 37 14 41 30 41 C46 41 48 37 48 37 C48 39 46 43 30 43 C14 43 12 39 12 37 Z" fill="url(#goldGrad)" />
    <!-- Steam waves -->
    <path d="M25 14 C25 11 27 10 27 8" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M30 15 C30 11 32 10 32 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M35 14 C35 11 37 10 37 8" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="30" cy="18" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="82" y="38" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="22" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    SELERA<tspan fill="#C84B31"> NUSANTARA</tspan>
  </text>
  <text x="83" y="56" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="600" fill="#78716C" letter-spacing="1.5">
    RUMAH MAKAN &amp; KULINER TRADISIONAL
  </text>
</svg>
